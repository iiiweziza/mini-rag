services:
  mongo:
    image: mongo:latest
    container_name: mongo
    restart: always
    user: "1000:1000"  # Map to typical first user UID/GID
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

    networks:
      - mongo-network   

networks:
  mongo-network:


volumes:
  mongo-data:
    driver: local
  
